aid: kadeya
name: Kadeya
description: >-
  Kadeya is a Chicago-based, female-founded climate technology company operating
  a closed-loop, waste-free beverage vending system for workplaces. Its
  autonomous stations dispense filtered water and flavored, carbonated, and
  branded drinks into reusable stainless steel "Infinite Bottles," filling a
  cold beverage on demand in under seven seconds. Used bottles are returned to
  any station where they are autonomously cleaned, sanitized, and refilled for
  reuse, eliminating single-use plastic on site. Kadeya owns and operates the
  stations and sells hydration-as-a-service, charging workplaces per drink so
  beverages are free for employees. It serves industrial and manufacturing
  sites, fulfillment centers, offices, universities, and fitness centers, and
  reports up to a 75% carbon reduction versus PET plastic bottles. Kadeya was
  surfaced as a Techstars portfolio company and added to the API Evangelist
  network. No public API, developer portal, or OpenAPI has been found.
